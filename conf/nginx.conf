# Agenda Productiva — Nginx config para YunoHost
# Archivos estáticos del dist servidos directamente; el resto va a FastAPI

location __PATH__/assets/ {
    alias __INSTALL_DIR__/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    gzip_static on;
}

location __PATH__/icons/ {
    alias __INSTALL_DIR__/dist/icons/;
    expires 30d;
    add_header Cache-Control "public";
}

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSOwat inyecta Authorization: Basic (basic-with-password) o X-Remote-User
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header X-Remote-User     $http_x_remote_user;

    proxy_redirect   off;
    proxy_buffering  off;
    client_max_body_size 10m;
    proxy_read_timeout   60s;
}
