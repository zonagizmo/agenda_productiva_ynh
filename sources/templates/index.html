<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Productiva</title>
  <!-- base href resuelve todos los paths relativos desde el subpath de YunoHost -->
  <base href="{{ path_prefix }}/">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4d96ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <link rel="apple-touch-icon" href="static/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="static/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="static/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">
    <div class="topbar-row1">
      <button class="menu-btn" id="menu-btn">☰</button>
      <span class="topbar-title" id="app-title">Agenda Productiva</span>
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button class="notif-btn default" id="notif-btn">🔔?</button>
    </div>
    <div class="topbar-row2">
      <button class="tab-btn active" data-tab="agenda">📅 Agenda</button>
      <button class="tab-btn" data-tab="tareas">📋 Tareas</button>
      <button class="tab-btn" data-tab="historial">📚 Historial</button>
      <button class="tab-btn" data-tab="config">⚙️ Config</button>
    </div>
  </div>

  <!-- AGENDA VIEW -->
  <div id="agenda-view" style="display:flex;flex:1;overflow:hidden">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-tabs" id="sidebar-tabs">
        <button class="sidebar-tab active" data-st="cal">📅 Cal</button>
        <button class="sidebar-tab" data-st="avisos">🔔</button>
      </div>
      <div class="sidebar-content" id="sidebar-content"></div>
    </div>

    <!-- MAIN PANEL -->
    <div id="main-panel" style="flex:1;overflow-y:auto;padding:1.3rem 1.2rem"></div>

  </div>

  <!-- TAREAS VIEW -->
  <div id="tareas-view" style="display:none;overflow-y:auto;flex:1"></div>

  <!-- HISTORIAL VIEW -->
  <div id="historial-view" style="display:none;overflow-y:auto;flex:1"></div>

  <!-- CONFIG VIEW -->
  <div id="config-view" style="display:none;overflow-y:auto;flex:1"></div>

</div>
<script src="static/app.js"></script>
<div id="version-tag">{{ version }}</div>
</body>
</html>
