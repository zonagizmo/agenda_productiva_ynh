packaging_format = 2

id = "agenda_productiva"
name = "Agenda Productiva"
description.en = "Multi-user daily planner with AI planning assistant"
description.es = "Planificador diario multiusuario con asistente de IA"

version = "2.3.7~ynh1"

maintainers = []

[upstream]
license = "MIT"

[integration]
yunohost = ">= 11.2"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = true
disk = "100M"
ram.build = "200M"
ram.runtime = "100M"

[install]

[install.domain]
type = "domain"

[install.path]
type = "path"
default = "/agenda"

[install.init_main_permission]
type = "group"
default = "all_users"

[resources]

[resources.system_user]

[resources.install_dir]

[resources.data_dir]

[resources.ports]
main.default = 8095

[resources.permissions]
main.url = "/"
main.auth_header = true

[resources.apt]
packages = "python3, python3-venv, python3-pip"
